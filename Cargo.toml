[package]
name = "opendex"
version = "1.0.0"
description = "A desktop workspace for model chat and coding agents"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
name = "opendex"
path = "src/lib.rs"

[[bin]]
name = "opendex"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:cpal", "dep:whisper-rs", "dep:objc2-av-foundation", "dep:block2", "dep:objc2", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "io-util", "fs", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
cpal = { version = "0.16", optional = true }
whisper-rs = { version = "0.16", optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
age = { version = "0.12", default-features = false }
sha2 = "0.10"
zeroize = "1"
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"], optional = true }

[profile.release]
lto = "thin"
strip = "debuginfo"
