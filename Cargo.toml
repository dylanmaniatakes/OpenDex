[package]
name = "opendex"
version = "0.1.0"
description = "A desktop workspace for model chat and coding agents"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
name = "opendex"
path = "src/lib.rs"

[[bin]]
name = "opendex"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "io-util", "fs", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
